name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_URL: ${{ secrets.REPO_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            RELEASE_DIR=/var/www/offerra/releases/$TIMESTAMP

            echo "--- Creating release ---"
            mkdir -p $RELEASE_DIR

            echo "--- Cloning repo ---"
            git clone -b master git@github.com:philtechphilips/offerra-be.git $RELEASE_DIR

            cd $RELEASE_DIR

            echo "--- Install dependencies ---"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "--- Setup .env ---"
            cp /var/www/offerra/shared/.env $RELEASE_DIR/.env

            echo "--- Laravel setup ---"
            php artisan key:generate --force
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan optimize

            echo "--- Fix permissions ---"
            chmod -R 775 storage bootstrap/cache

            echo "--- Switch symlink ---"
            ln -sfn $RELEASE_DIR /var/www/offerra/current

            echo "--- Reload services ---"
            php artisan queue:restart || true
            sudo systemctl reload nginx

            echo "--- Cleanup old releases ---"
            cd /var/www/offerra/releases
            ls -1t | tail -n +4 | xargs -r rm -rf

            echo "--- Done ---"
